services:
  - type: web
    name: invoice-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: apt-get update -y && apt-get install -y tesseract-ocr libgl1 libglib2.0-0 && pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: TOLERANCE_THRESHOLD
        value: "0.02"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
