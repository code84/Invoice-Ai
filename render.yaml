services:
  - type: web
    name: invoice-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: TOLERANCE_THRESHOLD
        value: "0.02"
      - key: ALLOWED_ORIGINS
        value: "https://frontendupdated-two.vercel.app"
