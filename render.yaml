services:
  - type: web
    name: invoice-processing-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: TOLERANCE_THRESHOLD
        value: "0.02"
      - key: ALLOWED_ORIGINS
        sync: false
